<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<body>
  <main id="welcome"><p class="eyebrow">项目体验</p><h1>Demo试验</h1><p>一个关于团队协同与成长的工作台。</p><button id="launch" type="button">解锁更多惊喜</button><p class="note">使用虚构数据体验，无需飞书账号。</p><a href="/">返回个人主页</a></main>

  <section id="demo-view" hidden><div class="topbar"><strong>Demo试验</strong><div><a href="/">个人主页</a><button id="lock" type="button">重新锁定</button></div></div><iframe id="workbench" title="PP 团队工作台互动演示"></iframe></section>
  <script type="module" src="./gate.js"></script>
